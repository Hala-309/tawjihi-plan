<!doctype html>
<html>
  <head>
    <meta charset="utf8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <style>
      :root {
        color-scheme: light;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      body {
        margin: 0;
        padding: 0;
        font:
          14px -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        background: #fff;
        color: #000;
      }
      img {
        max-width: 100%;
      }
      [hidden]:not([hidden="until-found" i]) {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <title>خطة التوجيهي العلمي</title>
    <meta name="claude:viewport-fit-sides" content="cover" />
    <link
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      /* layout: single column, tabbed; daily tasks carry the lesson + a 10-question quiz; errors flow into weekly/monthly review */
      :root {
        box-sizing: border-box;
        --bg: #eaf0f5;
        --card: #fff;
        --ink: #14212b;
        --mut: #5d6f7d;
        --line: #d5dfe7;
        --acc: #1f4fd8;
        --accbg: #e4ebfd;
        --ok: #14803c;
        --okbg: #e2f4e8;
        --bad: #b42318;
        --badbg: #fdeaea;
        --warn: #a85a00;
        --warnbg: #fff1dc;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          color-scheme: dark;
          --bg: #0f1820;
          --card: #17232d;
          --ink: #e8eef3;
          --mut: #93a5b3;
          --line: #2a3a47;
          --acc: #7da2ff;
          --accbg: #1c2c4d;
          --ok: #4ade80;
          --okbg: #14301f;
          --bad: #ff8a80;
          --badbg: #3a1a1a;
          --warn: #ffb454;
          --warnbg: #3a2a12;
        }
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --bg: #0f1820;
        --card: #17232d;
        --ink: #e8eef3;
        --mut: #93a5b3;
        --line: #2a3a47;
        --acc: #7da2ff;
        --accbg: #1c2c4d;
        --ok: #4ade80;
        --okbg: #14301f;
        --bad: #ff8a80;
        --badbg: #3a1a1a;
        --warn: #ffb454;
        --warnbg: #3a2a12;
      }
      * {
        box-sizing: border-box;
      }
      html.qo {
        overflow: hidden;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "Tajawal", system-ui, "Segoe UI", Tahoma, sans-serif;
        line-height: 1.6;
        font-size: 16px;
      }
      main {
        max-width: 560px;
        margin: 0 auto;
        padding: 14px max(16px, env(safe-area-inset-right, 0px)) 40px
          max(16px, env(safe-area-inset-left, 0px));
      }
      h1 {
        font-size: 22px;
        font-weight: 800;
        margin: 6px 0 2px;
      }
      .sub {
        color: var(--mut);
        font-size: 14px;
        margin: 0 0 12px;
      }
      nav {
        display: flex;
        gap: 6px;
        margin: 12px 0;
        overflow-x: auto;
        padding-bottom: 2px;
      }
      nav button {
        flex: 1;
        min-width: max-content;
        padding: 9px 12px;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--ink);
        border-radius: 10px;
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }
      nav button.on {
        background: var(--acc);
        border-color: var(--acc);
        color: #fff;
        font-weight: 700;
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible,
      summary:focus-visible,
      a:focus-visible {
        outline: 3px solid var(--acc);
        outline-offset: 2px;
      }
      .box {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px 14px;
        margin-bottom: 10px;
      }
      .hd {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
      }
      .big {
        font-size: 34px;
        font-weight: 800;
        line-height: 1.1;
      }
      .mut {
        color: var(--mut);
        font-size: 14px;
      }
      .pill {
        display: inline-block;
        padding: 2px 10px;
        border-radius: 99px;
        background: var(--accbg);
        color: var(--acc);
        font-size: 13px;
        font-weight: 700;
      }
      .pill.ok {
        background: var(--okbg);
        color: var(--ok);
      }
      .pill.bad {
        background: var(--badbg);
        color: var(--bad);
      }
      .pill.warn {
        background: var(--warnbg);
        color: var(--warn);
      }
      .bar {
        height: 8px;
        border-radius: 9px;
        background: var(--line);
        overflow: hidden;
        margin-top: 8px;
      }
      .bar i {
        display: block;
        height: 100%;
        background: var(--ok);
        transition: width 0.25s;
      }
      .task {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        padding: 10px 0 4px;
      }
      .task input {
        width: 22px;
        height: 22px;
        margin-top: 3px;
        accent-color: var(--acc);
        flex: none;
      }
      .stripe {
        width: 5px;
        align-self: stretch;
        border-radius: 4px;
        flex: none;
      }
      .task.d .t {
        text-decoration: line-through;
        color: var(--mut);
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .row > * {
        min-width: 0;
      }
      .go {
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--ink);
        border-radius: 10px;
        padding: 8px 14px;
        font: inherit;
        cursor: pointer;
        text-decoration: none;
        display: inline-block;
      }
      .go.p {
        background: var(--acc);
        color: #fff;
        border-color: var(--acc);
        font-weight: 700;
      }
      input[type="date"],
      input[type="text"],
      select,
      textarea {
        font: inherit;
        color: var(--ink);
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px 10px;
        width: 100%;
      }
      textarea {
        min-height: 70px;
        resize: vertical;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 8px;
      }
      .chip {
        width: 40px;
        height: 40px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: var(--bg);
        color: var(--ink);
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      .chip.on {
        background: var(--ok);
        border-color: var(--ok);
        color: #fff;
      }
      .cnt {
        width: 34px;
        height: 34px;
        padding: 0;
      }
      .dot {
        display: inline-block;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        margin-inline-end: 5px;
      }
      .err {
        border-inline-start: 5px solid;
        padding: 6px 10px;
        margin-top: 8px;
        background: var(--bg);
        border-radius: 8px;
      }
      .hist {
        display: flex;
        gap: 6px;
        margin-top: 8px;
      }
      .hc {
        flex: 1;
        text-align: center;
        font-size: 12px;
        color: var(--mut);
      }
      .hb {
        height: 56px;
        background: var(--line);
        border-radius: 6px;
        display: flex;
        align-items: flex-end;
        overflow: hidden;
        margin-bottom: 4px;
      }
      .hb i {
        display: block;
        width: 100%;
        background: var(--ok);
      }
      .hc b {
        display: block;
        color: var(--ink);
        font-weight: 700;
      }
      .ro input[type="checkbox"],
      .ro input[type="date"],
      .ro .chip,
      .ro .cnt,
      .ro textarea,
      .ro select {
        pointer-events: none;
        opacity: 0.6;
      }
      .wr {
        padding: 8px 0;
        border-bottom: 1px solid var(--line);
      }
      .wr.cur {
        background: var(--accbg);
        border-radius: 8px;
        padding: 8px;
      }
      .ro .go.p,
      .ro .qb,
      .ro .tb {
        display: none;
      }
      .tmr {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        padding: 0 0 8px 0;
        margin-inline-start: 15px;
      }
      .tmr b {
        font-variant-numeric: tabular-nums;
        font-size: 18px;
      }
      .gl {
        display: none;
        color: var(--ok);
        font-size: 13px;
        font-weight: 700;
      }
      .tmr.hit .gl {
        display: inline;
      }
      .live {
        font-size: 17px;
        padding-bottom: 6px;
      }
      .bd {
        width: 30%;
        min-width: 90px;
        text-align: center;
        padding: 8px 4px;
        border: 1px solid var(--line);
        border-radius: 10px;
        opacity: 0.35;
        filter: grayscale(1);
      }
      .bd.on {
        opacity: 1;
        filter: none;
        background: var(--accbg);
      }
      .bd span {
        font-size: 26px;
        display: block;
      }
      .bd small {
        font-size: 12px;
      }
      #ts {
        position: fixed;
        inset-inline: 16px;
        bottom: calc(16px + env(safe-area-inset-bottom, 0px));
        max-width: 420px;
        margin: 0 auto;
        background: var(--ink);
        color: var(--bg);
        padding: 12px 16px;
        border-radius: 12px;
        font-weight: 700;
        text-align: center;
        opacity: 0;
        transform: translateY(20px);
        transition: 0.25s;
        pointer-events: none;
        z-index: 80;
      }
      #ts.show {
        opacity: 1;
        transform: none;
      }
      .ex {
        margin-inline-start: 15px;
        padding-bottom: 10px;
        border-bottom: 1px solid var(--line);
      }
      .les {
        background: var(--bg);
        border-radius: 10px;
        padding: 8px 10px;
        margin-top: 6px;
      }
      .les .go {
        margin-top: 6px;
      }
      details > summary {
        cursor: pointer;
        color: var(--mut);
        font-size: 14px;
      }
      .seg {
        display: flex;
        gap: 6px;
        margin: 8px 0;
      }
      .seg button {
        flex: 1;
        padding: 8px;
        border: 1px solid var(--line);
        background: var(--bg);
        color: var(--ink);
        border-radius: 10px;
        font: inherit;
        cursor: pointer;
      }
      .seg button.on {
        background: var(--acc);
        color: #fff;
        border-color: var(--acc);
        font-weight: 700;
      }
      .sd {
        padding: 3px 0;
        font-size: 14px;
      }
      .dayh {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        margin-bottom: 4px;
      }
      .dayb {
        border-top: 1px solid var(--line);
        padding: 10px 0;
      }
      .dayb:first-child {
        border: 0;
      }
      .dayb.cur {
        background: var(--accbg);
        border-radius: 8px;
        padding: 10px;
      }
      bdi.m {
        unicode-bidi: isolate;
        direction: ltr;
        font-family: system-ui, "Segoe UI", sans-serif;
        white-space: nowrap;
      }
      .mi {
        border-top: 1px solid var(--line);
        padding: 8px 0;
      }
      .mi .a {
        color: var(--ok);
        font-weight: 700;
      }
      .sc {
        display: flex;
        align-items: baseline;
        gap: 8px;
      }
      .grid2 {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }
      #qz {
        position: fixed;
        inset: 0;
        z-index: 70;
        background: var(--bg);
        overflow: auto;
        padding: calc(14px + env(safe-area-inset-top, 0px))
          max(16px, env(safe-area-inset-right, 0px))
          calc(40px + env(safe-area-inset-bottom, 0px))
          max(16px, env(safe-area-inset-left, 0px));
      }
      .qin {
        max-width: 560px;
        margin: 0 auto;
      }
      .qt {
        font-size: 19px;
        font-weight: 700;
        margin: 14px 0 6px;
        line-height: 1.7;
      }
      .op {
        display: block;
        width: 100%;
        text-align: start;
        padding: 12px 14px;
        margin-top: 8px;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--ink);
        border-radius: 10px;
        font: inherit;
        cursor: pointer;
      }
      .op:disabled {
        cursor: default;
        color: var(--ink);
        opacity: 1;
      }
      .op.ok {
        border-color: var(--ok);
        background: var(--okbg);
        font-weight: 700;
      }
      .op.no {
        border-color: var(--bad);
        background: var(--badbg);
      }
      .fb {
        margin-top: 12px;
        padding: 10px 12px;
        border-radius: 10px;
        background: var(--card);
        border: 1px solid var(--line);
      }
      .fb.ok {
        border-color: var(--ok);
      }
      .fb.no {
        border-color: var(--bad);
      }
      .rs {
        font-size: 56px;
        font-weight: 800;
        line-height: 1.1;
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
      .tk {
        background: var(--card);
        border: 1px solid var(--line);
        border-inline-start: 6px solid;
        border-radius: 12px;
        padding: 12px 14px;
        margin-bottom: 10px;
      }
      .tk.d {
        opacity: 0.7;
      }
      .tk.d b {
        text-decoration: line-through;
      }
      .ls {
        background: var(--bg);
        border-radius: 10px;
        padding: 8px 10px;
        margin-top: 8px;
      }
      .lt {
        font-weight: 700;
      }
      .seg.wrap {
        flex-wrap: wrap;
      }
      .seg.wrap button {
        min-width: 30%;
      }
      .tk summary {
        margin-top: 8px;
      }
    </style>
    <main>
      <h1>خطة التوجيهي العلمي</h1>
      <p class="sub">جدول يومي من محتوى الرزم، واختبار بعد كل حصة</p>
      <div
        id="sync"
        class="pill warn"
        role="status"
        style="margin-bottom: 6px"
      ></div>
      <nav id="nav"></nav>
      <div id="v"></div>
    </main>
    <div
      id="qz"
      hidden
      role="dialog"
      aria-modal="true"
      aria-label="اختبار"
    ></div>
    <script>

              k: "متوسط التغير ومعناه الهندسي (ميل القاطع) والفيزيائي (متوسط السرعة)",
              q: [
                [
                  "e",

        let h = `<div class="box"><div class="hd"><div><div class="big">${l != null && l >= 0 ? l : 0} <span class="mut" style="font-size:16px">يوم على الامتحان</span></div><div class="mut">${inP1 ? "أنتِ بمرحلة التأسيس" : "أنتِ بمرحلة الحسم"}</div></div></div>
 <div class="mi"><div class="hd"><span>1. التأسيس: الدروس والاختبارات</span><span class="pill ${inP1 ? "" : "ok"}">${inP1 ? "الآن" : "انتهت"}</span></div><div class="mut">من ${fmt(PS)} إلى ${fmt(p2)}${inP1 ? " · الأسبوع " + Math.min(wk, tw) + " من " + tw : ""}</div></div>
 <div class="mi"><div class="hd"><span>2. الحسم: امتحان كامل كل يوم</span><span class="pill ${inP1 ? "" : "ok"}">${inP1 ? "بعدها" : "الآن"}</span></div><div class="mut">من ${fmt(p2)} حتى ${fmt(ex)}/${ex.getFullYear()}</div></div></div>
 <div class="box"><div class="hd"><b>الدروس اللي اختبرتِ فيها</b><span class="pill">${dn} من ${ids}</span></div><div class="bar"><i style="width:${ap}%"></i></div>
 ${SUBJ.map((x) => {
   const n = ORDER[x.k].length,
     c = ORDER[x.k].filter((i) => S.qz[i]).length;
   return `<div class="mi"><div class="hd"><span><span class="dot" style="background:${x.c}"></span>${x.n}</span><span class="mut">${c} من ${n}</span></div><div class="bar"><i style="width:${Math.round((c / n) * 100)}%;background:${x.c}"></i></div></div>`;
 }).join("")}</div>`;
        return h;
      }
      /* ===== المؤقت والحوافز (كما كانت) ===== */
      const now = () => Date.now();
      function secs(key) {
        let s = (S.tm && S.tm[key]) || 0;
        if (S.run && S.run.key == key)
          s += Math.max(0, Math.floor((now() - S.run.t0) / 1000));
        return s;
      }
      const hms = (s) => {
        const h = Math.floor(s / 3600),
          m = Math.floor((s % 3600) / 60);
        return (
          (h ? h + ":" : "") +
          String(m).padStart(h ? 2 : 1, "0") +
          ":" +
          String(s % 60).padStart(2, "0")
        );
      };
      function stopRun() {
        if (S.run) {
          S.tm = S.tm || {};
          S.tm[S.run.key] =
            (S.tm[S.run.key] || 0) +
            Math.max(0, Math.floor((now() - S.run.t0) / 1000));
          S.run = null;
        }
      }
      function tmr(key, n) {
        if (VIEW || RO) return;
        if (S.run && S.run.key == key) {
          stopRun();
          toast("تم إيقاف الحصة، بارك الله بجهدك 👏");
        } else {
          stopRun();
          S.run = { key, t0: now(), n };
          toast("بالتوفيق! الحصة بدأت ⏱️");
        }
        save();
        draw();
      }
      function tmrRow(key, m, n) {
        const on = S.run && S.run.key == key,
          s = secs(key);
        return `<div class="tmr ${s >= m * 60 ? "hit" : ""}"><button class="go tb ${on ? "p" : ""}" onclick="tmr('${key}','${n}')">${on ? "إيقاف" : "ابدأ الحصة"}</button><b data-t="${key}" data-m="${m}">${hms(s)}</b><span class="mut">من ${m} د</span><span class="gl">✓ وصلتِ للهدف، كمّلي براحتك</span></div>`;
      }
      function liveHtml() {
        const s = stats();
        let t = "";
        if (S.run)
          t = `<div class="live">🔴 ${VIEW ? "تدرس الآن" : "الحصة شغالة"}: <b>${esc(S.run.n || "")}</b> <b data-lv>${hms(secs(S.run.key))}</b></div>`;
        else if (VIEW) t = '<div class="mut">⚪ ما في حصة شغالة هلأ</div>';
        return `<div class="box">${t}<div class="mut">⭐ ${s.pts} نقطة · 🔥 ${s.st} أيام متواصلة</div></div>`;
      }
      function tick() {
        document.querySelectorAll("[data-t]").forEach((e) => {
          const s = secs(e.dataset.t);
          e.textContent = hms(s);
          e.parentNode.classList.toggle("hit", s >= e.dataset.m * 60);
        });
        const lv = document.querySelector("[data-lv]");
        if (lv && S.run) lv.textContent = hms(secs(S.run.key));
      }
      const LV = [
        [0, "مبتدئة 🌱"],
        [100, "مجتهدة 📘"],
        [300, "متميزة ⭐"],
        [600, "متألقة 🚀"],
        [1000, "بطلة 🏅"],
        [1600, "نجمة التوجيهي 👑"],
      ];
      function lvl(p) {
        let i = 0;
        LV.forEach((l, j) => {
          if (p >= l[0]) i = j;
        });
        return i;
      }
      const BG = [
        ["أول مهمة", "✅", (s) => s.dn >= 1],
        ["10 مهام", "🔟", (s) => s.dn >= 10],
        ["ساعة دراسة", "⏱️", (s) => s.mins >= 60],
        ["10 ساعات", "🔥", (s) => s.mins >= 600],
        ["يوم كامل", "🌟", (s) => s.full >= 1],
        ["3 أيام متواصلة", "📅", (s) => s.st >= 3],
        ["أسبوع متواصل", "🏆", (s) => s.st >= 7],
        ["أول رزمة", "📦", (s) => s.pk >= 1],
        ["5 رزم", "🎯", (s) => s.pk >= 5],
        ["أول اختبار", "📝", (s) => s.qn >= 1],
        ["علامة كاملة", "💯", (s) => s.perf >= 1],
        ["أتقنتِ 10 أخطاء", "🧠", (s) => s.mast >= 10],
      ];
      function stats() {
        let dn = 0,
          mins = 0,
          full = 0,
          days = {};
        for (const k in S.done)
          if (S.done[k]) {
            dn++;
            const d = k.split("|")[0];
            days[d] = (days[d] || 0) + 1;
          }
        for (const k in S.tm || {}) mins += Math.floor(S.tm[k] / 60);
        const pk = SUBJ.reduce(
          (a, x) => a + Object.values(S.pd[x.k] || {}).filter(Boolean).length,
          0,
        );
        Object.keys(days).forEach((d) => {
          const t = tasksFor(new Date(d + "T12:00:00")).t.filter(
            (x) => x[1] > 0,
          ).length;
          if (t && days[d] >= t) full++;
        });
        let st = 0;
        for (let i = 0; i < 400; i++) {
          if (days[iso(dayOf(-i))]) st++;
          else if (i) break;
        }
        const qn = S.ql.length,
          perf = S.ql.filter((x) => x.c == x.t && x.t >= 10).length,
          mast = Object.keys(S.me).filter((i) => S.me[i].lv >= 2).length;
        return {
          dn,
          mins,
          pk,
          full,
          st,
          qn,
          perf,
          mast,
          pts:
            dn * 10 +
            Math.floor(mins / 10) +
            pk * 25 +
            full * 30 +
            qn * 10 +
            perf * 15 +
            mast * 5,
        };
      }
      function rRw() {
        const s = stats(),
          i = lvl(s.pts),
          nx = LV[i + 1],
          pr = nx
            ? Math.round(((s.pts - LV[i][0]) / (nx[0] - LV[i][0])) * 100)
            : 100;
        return `<div class="box"><div class="big">${s.pts} <span class="mut" style="font-size:16px">نقطة</span></div><b>${LV[i][1]}</b><div class="bar"><i style="width:${pr}%"></i></div><div class="mut">${nx ? "باقي " + (nx[0] - s.pts) + " نقطة للمستوى التالي: " + nx[1] : "وصلتِ لأعلى مستوى!"}</div></div>
 <div class="box"><div class="hd"><span>🔥 ${s.st} أيام متواصلة</span><span>⏱️ ${hms(s.mins * 60)} دراسة</span></div><p class="mut">النقاط: 10 لكل مهمة، 1 لكل 10 دقايق دراسة، 25 لكل رزمة، 30 ليوم كامل، 10 لكل اختبار، 15 لعلامة كاملة، 5 لكل خطأ تتقنيه.</p></div>
 <div class="box"><b>الأوسمة</b><div class="chips">${BG.map((b) => `<div class="bd ${b[2](s) ? "on" : ""}"><span>${b[1]}</span><small>${b[0]}</small></div>`).join("")}</div></div>`;
      }
      function toast(m) {
        let e = document.getElementById("ts");
        if (!e) {
          e = document.createElement("div");
          e.id = "ts";
          e.setAttribute("role", "status");
          document.body.appendChild(e);
        }
        e.textContent = m;
        e.className = "show";
        clearTimeout(toast.t);
        toast.t = setTimeout(() => {
          e.className = "";
        }, 2800);
      }
      function hist() {
        let c = "";
        for (let i = 6; i >= 0; i--) {
          const d = dayOf(off - i),
            k = iso(d),
            w = tasksFor(d)
              .t.map((x, j) => [x, j])
              .filter(([x]) => x[1] > 0),
            n = w.filter(([, j]) => S.done[k + "|" + j]).length,
            p = w.length ? Math.round((n / w.length) * 100) : 0;
          c += `<div class="hc"><div class="hb"><i style="height:${p}%"></i></div><span>${d.getDate()}/${d.getMonth() + 1}</span><b>${p}%</b></div>`;
        }
        return `<div class="box"><b>إنجاز آخر 7 أيام</b><div class="hist">${c}</div></div>`;
      }
      function tg(key) {
        if (VIEW || RO) {
          draw();
          return;
        }
        const b = stats();
        S.done[key] = !S.done[key];
        save();
        const a = stats();
        draw();
        if (S.done[key]) {
          const nb = BG.find((x) => x[2](a) && !x[2](b)),
            L = lvl(a.pts) > lvl(b.pts);
          toast(
            L
              ? "🎉 مستوى جديد: " + LV[lvl(a.pts)][1]
              : nb
                ? "🏅 وسام جديد: " + nb[0]
                : a.full > b.full
                  ? "🌟 يوم كامل! +40 نقطة"
                  : "أحسنتِ! +10 نقطة 🎉",
          );
        }
      }
      function rPk() {
        return SUBJ.map((s) => {
          const n = S.pk[s.k],
            d = S.pd[s.k] || {},
            c = Object.values(d).filter(Boolean).length;
          return `<div class="box"><div class="hd"><b><span class="dot" style="background:${s.c}"></span>${s.n}</b><span class="row"><button class="go cnt" onclick="pn('${s.k}',-1)" aria-label="أقل">-</button><span>${n} رزم</span><button class="go cnt" onclick="pn('${s.k}',1)" aria-label="أكثر">+</button></span></div>
  <div class="bar"><i style="width:${n ? Math.round((c / n) * 100) : 0}%"></i></div><div class="mut">خلصتِ ${c} من ${n}</div>
  <div class="chips">${Array.from({ length: n }, (_, i) => `<button class="chip ${d[i] ? "on" : ""}" onclick="pt('${s.k}',${i})" aria-label="رزمة ${i + 1}">${i + 1}</button>`).join("")}</div></div>`;
        }).join("");
      }
      function pn(k, v) {
        if (VIEW || RO) return;
        S.pk[k] = Math.max(1, Math.min(20, S.pk[k] + v));
        save();
        draw();
      }
      function pt(k, i) {
        if (VIEW || RO) {
          draw();
          return;
        }
        S.pd[k] = S.pd[k] || {};
        S.pd[k][i] = !S.pd[k][i];
        save();
        draw();
        if (S.pd[k][i]) toast("📦 رزمة منجزة! +25 نقطة");
      }
      if (VIEW) {
        document.querySelector(".sub").textContent =
          "وضع المتابعة - للقراءة فقط";
        tab = "more";
        mo = "sum";
      }
      setInterval(tick, 1000);
      draw();
    </script>
  </body>
</html>

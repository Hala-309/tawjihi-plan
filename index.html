<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>خطة التوجيهي العلمي</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
--bg:#eaf0f5;--card:#fff;--ink:#14212b;--mut:#5d6f7d;--line:#d5dfe7;--acc:#1f4fd8;--accbg:#e4ebfd;--ok:#14803c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1820;--card:#17232d;--ink:#e8eef3;--mut:#93a5b3;--line:#2a3a47;--acc:#7da2ff;--accbg:#1c2c4d;--ok:#4ade80}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1820;--card:#17232d;--ink:#e8eef3;--mut:#93a5b3;--line:#2a3a47;--acc:#7da2ff;--accbg:#1c2c4d;--ok:#4ade80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Tajawal',system-ui,'Segoe UI',Tahoma,sans-serif;line-height:1.6;font-size:16px}
main{max-width:560px;margin:0 auto;padding:14px 14px 40px}
h1{font-size:22px;font-weight:800;margin:6px 0 2px}
.sub{color:var(--mut);font-size:14px;margin:0 0 12px}
nav{display:flex;gap:6px;margin:12px 0;overflow-x:auto}
nav button{flex:1;min-width:max-content;padding:9px 12px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:inherit;font-weight:500;cursor:pointer}
nav button.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.big{font-size:34px;font-weight:800;line-height:1.1}
.mut{color:var(--mut);font-size:14px}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--accbg);color:var(--acc);font-size:13px;font-weight:700}
.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--ok);transition:width .25s}
.task{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.task:last-child{border:0}
.task input{width:22px;height:22px;margin-top:3px;accent-color:var(--acc);flex:none}
.stripe{width:5px;align-self:stretch;border-radius:4px;flex:none}
.task.d .t{text-decoration:line-through;color:var(--mut)}
.t b{font-weight:700}
.row{display:flex;gap:8px;align-items:center}
.row>*{min-width:0}
.go{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 14px;font:inherit;cursor:pointer}
.go.p{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:700}
input[type=date],input[type=text],select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%}
textarea{min-height:70px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.chip.on{background:var(--ok);border-color:var(--ok);color:#fff}
.cnt{width:34px;height:34px;padding:0}
.wk{width:100%;border-collapse:collapse;font-size:14px}
.wk td,.wk th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
.wk th{color:var(--mut);font-weight:500;white-space:nowrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:5px}
.err{border-inline-start:5px solid;padding:6px 10px;margin-top:8px;background:var(--bg);border-radius:8px}
.hist{display:flex;gap:6px;margin-top:8px}.hc{flex:1;text-align:center;font-size:12px;color:var(--mut)}.hb{height:56px;background:var(--line);border-radius:6px;display:flex;align-items:flex-end;overflow:hidden;margin-bottom:4px}.hb i{display:block;width:100%;background:var(--ok)}.hc b{display:block;color:var(--ink);font-weight:700}
.ro input[type=checkbox],.ro input[type=date],.ro .chip,.ro .cnt,.ro textarea,.ro select{pointer-events:none;opacity:.6}
.wr{padding:8px 0;border-bottom:1px solid var(--line)}.wr.cur{background:var(--accbg);border-radius:8px;padding:8px}
</style>
</head>
<body>
<main>
<h1>خطة التوجيهي العلمي</h1>
<p class="sub">مبنية على الرزم التعليمية لكل مبحث</p>
<nav id="nav"></nav>
<div id="v"></div>
</main>
<script>
const SUBJ=[{k:'math',n:'رياضيات',c:'#1f4fd8'},{k:'phy',n:'فيزياء',c:'#0e8a7d'},{k:'chem',n:'كيمياء',c:'#9333ea'},{k:'bio',n:'أحياء',c:'#2f9e44'},{k:'ar',n:'عربي',c:'#c2410c'},{k:'en',n:'إنجليزي',c:'#d6336c'},{k:'rel',n:'تربية إسلامية',c:'#64748b'}];
const SP={TEST:['اختبار أسبوعي','#e67700'],FIX:['تصحيح وتسجيل الأخطاء','#e67700'],ERR:['دفتر الأخطاء','#e67700'],REST:['راحة','#94a3b8']};
const info=k=>SP[k]?{n:SP[k][0],c:SP[k][1]}:SUBJ.find(s=>s.k==k);
const W={
6:[['math',75,'رزمة جديدة: فهم + قراءة الكتاب'],['phy',60,'رزمة جديدة: فهم + قراءة الكتاب'],['chem',45,'رزمة: فهم + قراءة الكتاب'],['ar',45,'نصوص ونحو من الرزمة']],
0:[['math',75,'رزمة جديدة: فهم + قراءة الكتاب'],['phy',60,'رزمة جديدة: فهم + قراءة الكتاب'],['bio',45,'رزمة: فهم + حفظ'],['en',45,'مفردات وقراءة']],
1:[['math',75,'حل أسئلة الرزمة + أسئلة الكتاب'],['phy',60,'حل أسئلة الرزمة + أسئلة الكتاب'],['chem',45,'حل أسئلة الرزمة'],['rel',30,'حفظ ومراجعة']],
2:[['math',75,'حل أسئلة الرزمة + أسئلة الكتاب'],['phy',60,'حل أسئلة الرزمة + أسئلة الكتاب'],['bio',45,'حفظ + أسئلة الرزمة'],['ar',45,'بلاغة وقواعد']],
3:[['math',60,'تلخيص الرزمة بصفحة واحدة'],['phy',60,'تلخيص الرزمة بصفحة واحدة'],['en',45,'كتابة وقواعد'],['rel',30,'مراجعة وحفظ']],
4:[['math',60,'اختبار قصير على الرزمة بالوقت الرسمي'],['phy',60,'اختبار قصير على الرزمة بالوقت الرسمي'],['TEST',60,'اختبار أسبوعي على رزمة مبحث آخر (يتبدل كل أسبوع)'],['FIX',45,'تصحيح الاختبارات وكتابة الأخطاء']],
5:[['math',45,'مراجعة خفيفة للأسبوع'],['phy',45,'مراجعة خفيفة للأسبوع'],['ERR',45,'مراجعة دفتر الأخطاء'],['REST',0,'راحة نصف يوم']]};
const DN=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
let S={exam:'',pk:{},done:{},pd:{},errs:[]};
try{const r=localStorage.getItem('tj1');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
SUBJ.forEach(s=>{if(S.pk[s.k]==null)S.pk[s.k]=6});
if(!S.exam)S.exam='2027-04-01';
let DBD=null,RO=false,st='على هذا الجهاز فقط',tm=null;
const pick=()=>({exam:S.exam,pk:S.pk,done:S.done,pd:S.pd,errs:S.errs});
const stat=()=>{const e=document.getElementById('st');if(e)e.textContent=st};
const save=()=>{try{localStorage.setItem('tj1',JSON.stringify(S))}catch(e){}
 if(!DBD||RO)return;clearTimeout(tm);
 tm=setTimeout(()=>{DBD.set(pick()).then(()=>{st='محفوظ للجميع';stat()}).catch(()=>{RO=true;st='للقراءة فقط';draw()})},400)};
(async()=>{try{
 const c=window.claude&&await window.claude.use('db');if(!c)return;
 try{const u=await window.claude.use('user');if(u&&u.can&&u.can('data.write')===false)RO=true}catch(e){}
 DBD=c.doc('plan/state');
 DBD.onSnapshot(s=>{
  if(s.metadata&&s.metadata.hasPendingWrites)return;
  st=RO?'للقراءة فقط':'محفوظ للجميع';
  if(s.exists){const d=s.data();
   if(JSON.stringify(d)!==JSON.stringify(pick())){Object.assign(S,d);SUBJ.forEach(x=>{if(S.pk[x.k]==null)S.pk[x.k]=6});if(!S.exam){S.exam='2027-04-01';setTimeout(save,0)}try{localStorage.setItem('tj1',JSON.stringify(S))}catch(e){}draw()}else stat()}
  else{if(!RO)DBD.set(pick()).catch(()=>{});stat()}
 },()=>{});
}catch(e){}})();
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let off=0,tab='today';
function dayOf(o){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+o);return d}
function leftTo(d){return S.exam?Math.round((new Date(S.exam+'T12:00:00')-d)/864e5):null}
function tasksFor(d){
 const l=leftTo(d);
 if(l!=null&&l>=0&&l<=56){const s=SUBJ[Math.floor(d/864e5)%7].k;
  return{ph:'الحسم: امتحانات كاملة',t:[[s,120,'امتحان كامل بوقته من نماذج السنوات السابقة'],['FIX',60,'تصحيح وتسجيل الأخطاء'],['ERR',30,'دفتر الأخطاء قبل النوم']]}}
 const t=W[d.getDay()].map(x=>x.slice());
 if(d.getDay()==4){const o=SUBJ.filter(s=>s.k!='math'&&s.k!='phy');t.forEach(x=>{if(x[0]=='TEST')x[0]=o[Math.floor(d/6048e5)%5].k})}
 return{ph:'التأسيس والرزم',t}}
function setT(t){tab=t;draw()}
function draw(){
 const T={today:'اليوم',plan:'المسار',week:'الجدول',pk:'الرزم',err:'الأخطاء'};
 $('nav').innerHTML=Object.keys(T).map(k=>`<button class="${k==tab?'on':''}" onclick="setT('${k}')">${T[k]}</button>`).join('');
 $('v').innerHTML={today:rToday,plan:rPlan,week:rWeek,pk:rPk,err:rErr}[tab]();
 document.querySelector('main').classList.toggle('ro',RO);
}
const $=id=>document.getElementById(id);
function rToday(){
 const d=dayOf(off),{ph,t}=tasksFor(d),k=iso(d),l=leftTo(d);
 const work=t.map((x,i)=>[x,i]).filter(([x])=>x[1]>0);
 const dn=work.filter(([,i])=>S.done[k+'|'+i]).length,pc=work.length?Math.round(dn/work.length*100):0;
 let h=`<div class="box"><div class="hd"><div><div class="big">${l!=null&&l>=0?l+' يوم':'حدد موعد الامتحان'}</div><div class="mut">${l!=null&&l>=0?'على الامتحان':'ليبدأ العد التنازلي ومرحلة الحسم'}</div></div><span class="pill">${ph}</span></div>
 <div class="row" style="margin-top:10px"><input type="date" value="${S.exam}" onchange="S.exam=this.value;save();draw()" aria-label="موعد أول امتحان"></div><div class="mut" id="st" style="margin-top:6px">${st}</div></div>${hist()}
 <div class="box"><div class="hd"><button class="go" onclick="off--;draw()">اليوم السابق</button><b>${DN[d.getDay()]} ${d.getDate()}/${d.getMonth()+1}</b><button class="go" onclick="off++;draw()">اليوم التالي</button></div>
 <div class="bar"><i style="width:${pc}%"></i></div><div class="mut">أنجزتِ ${dn} من ${work.length}</div></div><div class="box">`;
 t.forEach((x,i)=>{const f=info(x[0]),dd=S.done[k+'|'+i];
  h+=`<label class="task ${dd?'d':''}"><span class="stripe" style="background:${f.c}"></span>${x[1]>0?`<input type="checkbox" ${dd?'checked':''} onchange="tg('${k}|${i}')">`:''}<span class="t"><b>${f.n}</b>${x[1]>0?' - '+x[1]+' دقيقة':''}<br><span class="mut">${x[2]}</span></span></label>`});
 if(off!=0)h+=`<button class="go" onclick="off=0;draw()" style="margin-top:8px">العودة لليوم</button>`;
 h+=`<button class="go p" onclick="rep()" style="margin-top:8px;width:100%">أرسلي تقرير اليوم عالواتس</button><div id="rp"></div>`;
 return h+'</div>'}
const fmt=d=>d.getDate()+'/'+(d.getMonth()+1);
function rPlan(){
 const ex=new Date(S.exam+'T12:00:00'),t0=dayOf(0),s=new Date(t0);s.setDate(s.getDate()-((s.getDay()+1)%7));
 const p2=new Date(ex);p2.setDate(p2.getDate()-56);
 const P1=Math.max(1,Math.round((p2-s)/6048e5));
 const tot=SUBJ.reduce((a,x)=>a+S.pk[x.k],0),dn=SUBJ.reduce((a,x)=>a+Object.values(S.pd[x.k]||{}).filter(Boolean).length,0),ap=tot?Math.round(dn/tot*100):0;
 let h=`<div class="box"><b>مسار الخطة حتى الامتحانات</b><p class="mut">بداية الامتحانات: ${fmt(ex)}/${ex.getFullYear()}<br>مرحلة الحسم تبدأ: ${fmt(p2)}<br>إنجازك من الرزم: ${ap}%</p><div class="bar"><i style="width:${ap}%"></i></div></div><div class="box">`;
 for(let i=0;i<60;i++){const a=new Date(s);a.setDate(a.getDate()+i*7);if(a>=ex)break;
  const b=new Date(a);b.setDate(b.getDate()+6);const f=a<p2,tg=f?Math.min(100,Math.round((i+1)/P1*100)):100,cur=t0>=a&&t0<=b;
  h+=`<div class="wr ${cur?'cur':''}"><div class="hd"><b>${fmt(a)} - ${fmt(b)}</b><span class="pill">${f?'التأسيس والرزم':'الحسم'}</span></div><div class="mut">${f?'الهدف: إنهاء '+tg+'% من الرزم':'امتحان كامل كل يوم + تصحيح'}</div><div class="bar"><i style="width:${tg}%"></i></div></div>`}
 return h+'</div>'}
function rep(){
 const d=dayOf(off),k=iso(d),t=tasksFor(d).t;let m='تقرير التوجيهي - '+DN[d.getDay()]+' '+fmt(d)+'\n',n=0,w=0;
 t.forEach((x,i)=>{if(x[1]>0){w++;const ok=S.done[k+'|'+i];if(ok)n++;m+=(ok?'✅ ':'⬜ ')+info(x[0]).n+'\n'}});
 const tot=SUBJ.reduce((a,x)=>a+S.pk[x.k],0),dn=SUBJ.reduce((a,x)=>a+Object.values(S.pd[x.k]||{}).filter(Boolean).length,0);
 m+='الإنجاز اليوم: '+n+' من '+w+'\n'+'الرزم المنجزة: '+dn+' من '+tot;
 $('rp').innerHTML=`<textarea id="rt" readonly style="margin-top:8px;min-height:130px;pointer-events:auto;opacity:1">${esc(m)}</textarea><div class="row" style="margin-top:8px"><button class="go p" onclick="cp()">نسخ التقرير</button><a class="go" href="https://wa.me/?text=${encodeURIComponent(m)}" target="_blank" rel="noopener">فتح الواتس</a></div>`}
function cp(){const t=$('rt');t.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}
 if(!ok&&navigator.clipboard)navigator.clipboard.writeText(t.value);event.target.textContent='تم النسخ'}
function hist(){let c='';for(let i=6;i>=0;i--){const d=dayOf(off-i),k=iso(d),w=tasksFor(d).t.map((x,j)=>[x,j]).filter(([x])=>x[1]>0),n=w.filter(([,j])=>S.done[k+'|'+j]).length,p=w.length?Math.round(n/w.length*100):0;
 c+=`<div class="hc"><div class="hb"><i style="height:${p}%"></i></div><span>${d.getDate()}/${d.getMonth()+1}</span><b>${p}%</b></div>`}
 return `<div class="box"><b>إنجاز آخر 7 أيام</b><div class="hist">${c}</div></div>`}
function tg(key){S.done[key]=!S.done[key];save();draw()}
function rWeek(){
 let h=`<div class="box"><b>الأسبوع الاعتيادي</b><p class="mut">رياضيات وفيزياء كل يوم، ومعهم مادتين من الباقي بالتناوب. كل رزمة تمشي بالترتيب: فهم، حل، تلخيص، اختبار.</p><table class="wk">`;
 [6,0,1,2,3,4,5].forEach(g=>{h+=`<tr><th>${DN[g]}</th><td>`+W[g].map(x=>{const f=info(x[0]);return `<div><span class="dot" style="background:${f.c}"></span>${f.n}${x[1]?' '+x[1]+' د':''}</div>`}).join('')+'</td></tr>'});
 h+=`</table></div><div class="box"><b>المراحل</b><p><span class="pill">التأسيس والرزم</span><br>من البداية حتى قبل الامتحان بثمانية أسابيع: رزمة كاملة لكل مبحث بدورة 7 أيام.</p><p><span class="pill">الحسم</span><br>آخر 8 أسابيع: كل يوم امتحان كامل لمبحث بوقته، ثم تصحيح ودفتر الأخطاء. يبدأ تلقائياً بعد ما تحددي موعد الامتحان.</p></div>
 <div class="box"><b>دورة الرزمة الواحدة</b><p class="mut">1-2 فهم، 3-4 حل، 5 تلخيص، 6 اختبار، 7 تصحيح. بعد كل رزمتين مراجعة سريعة تجمعهم.</p></div>`;
 return h}
function rPk(){
 return SUBJ.map(s=>{const n=S.pk[s.k],d=S.pd[s.k]||{},c=Object.values(d).filter(Boolean).length;
  return `<div class="box"><div class="hd"><b><span class="dot" style="background:${s.c}"></span>${s.n}</b><span class="row"><button class="go cnt" onclick="pn('${s.k}',-1)" aria-label="أقل">-</button><span>${n} رزم</span><button class="go cnt" onclick="pn('${s.k}',1)" aria-label="أكثر">+</button></span></div>
  <div class="bar"><i style="width:${n?Math.round(c/n*100):0}%"></i></div><div class="mut">خلصتِ ${c} من ${n}</div>
  <div class="chips">${Array.from({length:n},(_,i)=>`<button class="chip ${d[i]?'on':''}" onclick="pt('${s.k}',${i})" aria-label="رزمة ${i+1}">${i+1}</button>`).join('')}</div></div>`}).join('')}
function pn(k,v){S.pk[k]=Math.max(1,Math.min(20,S.pk[k]+v));save();draw()}
function pt(k,i){S.pd[k]=S.pd[k]||{};S.pd[k][i]=!S.pd[k][i];save();draw()}
function rErr(){
 let h=`<div class="box"><b>دفتر الأخطاء</b><p class="mut">اكتبي كل خطأ بعد الاختبار: وين غلطتِ وشو الصح.</p>
 <select id="es">${SUBJ.map(s=>`<option value="${s.k}">${s.n}</option>`).join('')}</select>
 <textarea id="et" placeholder="الخطأ والتصحيح" style="margin-top:8px"></textarea>
 <button class="go p" style="margin-top:8px" onclick="ae()">حفظ الخطأ</button></div>`;
 if(!S.errs.length)h+=`<div class="box mut">ما في أخطاء مسجلة. بعد أول اختبار سجلي أخطاءك هون.</div>`;
 S.errs.slice().reverse().forEach((e,j)=>{const f=info(e.s),i=S.errs.length-1-j;
  h+=`<div class="box"><div class="hd"><b>${f.n}</b><button class="go" onclick="de(${i})">حذف</button></div><div class="err" style="border-color:${f.c}">${esc(e.t)}</div></div>`});
 return h}
function ae(){const t=$('et').value.trim();if(!t)return;S.errs.push({s:$('es').value,t});save();draw()}
function de(i){S.errs.splice(i,1);save();draw()}
draw();
</script>
</body>
</html>
